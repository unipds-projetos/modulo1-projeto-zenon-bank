services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: zenon
      MYSQL_USER: zenon
      MYSQL_PASSWORD: zenon
      MYSQL_ROOT_PASSWORD: zenon-root
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - ./script.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uzenon", "-pzenon"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
